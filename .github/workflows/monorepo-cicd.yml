name: Monorepo Microservices CI/CD to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # Triggers the automation workflow only when modifications are pushed within any of the 5 service directories
    paths:
      - '.github/workflows/monorepo-cicd.yml'
      - 'api-gateway/**'
      - 'discovery-server/**'
      - 'identity-service/**'
      - 'cv-management-service/**'
      - 'discovery-social-service/**'

permissions:
  contents: read

jobs:
  # Stage 1: Delta Detection & Service Matrix Mapping
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: '.github/workflows/monorepo-cicd.yml'
            api-gateway: 'api-gateway/**'
            discovery-server: 'discovery-server/**'
            identity-service: 'identity-service/**'
            cv-management-service: 'cv-management-service/**'
            discovery-social-service: 'discovery-social-service/**'

      - name: Resolve Service Matrix
        id: matrix
        run: |
          ALL_SERVICES='["api-gateway","discovery-server","identity-service","cv-management-service","discovery-social-service"]'
          CHANGED_SERVICES='${{ steps.filter.outputs.changes }}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
            echo "services=${ALL_SERVICES}" >> "$GITHUB_OUTPUT"
            echo "Building all services because this was a manual run or the workflow file changed."
          else
            echo "services=${CHANGED_SERVICES}" >> "$GITHUB_OUTPUT"
            echo "Building changed services: ${CHANGED_SERVICES}"
          fi

  # Stage 2: Docker Hub Credential Validation
  validate-dockerhub:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub Secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing repository secret: DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing repository secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Check Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Stage 3: Parallelized Compilation & Artifact Deployment (Matrix Build)
  build-and-deploy:
    needs:
      - detect-changes
      - validate-dockerhub
    # Conditional Guardrail: Bypasses execution if no structural code modifications occurred (e.g., plain documentation updates)
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dynamic Execution Matrix: Iterates concurrently only over the subset of modified microservices
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      # 1. Clone the codebase into the virtual runner workspace host
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Provision and configure the OpenJDK 17 build environment
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compile the targeted service source into an executable JAR binary (Skipping test suites for rapid delivery)
      - name: Build JAR Package with Maven
        run: mvn -B -pl ${{ matrix.service }} -am clean package -DskipTests

      - name: Prepare Docker Build Artifact
        run: |
          JAR_FILE=$(find "${{ matrix.service }}/target" -maxdepth 1 -type f -name "*.jar" ! -name "*.original" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR file found for ${{ matrix.service }}"
            exit 1
          fi

          mkdir -p ".docker-build/${{ matrix.service }}"
          cp "$JAR_FILE" ".docker-build/${{ matrix.service }}/app.jar"

      # 4. Securely authenticate session credentials against Docker Hub repository using GitHub Encrypted Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Synthesize OCI container layers and dispatch to the remote registry with production tags (latest & unique Commit SHA)
      - name: Build and Push Docker Image
        run: |
          retry() {
            local max_attempts=3
            local delay_seconds=20

            for attempt in $(seq 1 "$max_attempts"); do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi

              echo "Command failed on attempt ${attempt}. Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
            done
          }

          # Standardize image coordinate namespaces matching user workspace parameters
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}"

          # Build the immutable image artifact layers locally on the worker node.
          # CI uses the JAR already produced by Maven, so Docker does not pull a Maven builder image.
          retry docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -f Dockerfile.ci \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

          # Push built multi-tagged container records into the central Docker Hub registry
          retry docker push $IMAGE_NAME:latest
          retry docker push $IMAGE_NAME:${{ github.sha }}
