name: Monorepo Microservices CI/CD to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # Triggers the automation workflow only when modifications are pushed within any of the 5 service directories
    paths:
      - '.github/workflows/monorepo-cicd.yml'
      - 'api-gateway/**'
      - 'discovery-server/**'
      - 'identity-service/**'
      - 'cv-management-service/**'
      - 'discovery-social-service/**'

permissions:
  contents: read

jobs:
  # Stage 1: Delta Detection & Service Matrix Mapping
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            discovery-server: 'discovery-server/**'
            identity-service: 'identity-service/**'
            cv-management-service: 'cv-management-service/**'
            discovery-social-service: 'discovery-social-service/**'

  # Stage 2: Docker Hub Credential Validation
  validate-dockerhub:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub Secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing repository secret: DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing repository secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Check Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Stage 3: Parallelized Compilation & Artifact Deployment (Matrix Build)
  build-and-deploy:
    needs:
      - detect-changes
      - validate-dockerhub
    # Conditional Guardrail: Bypasses execution if no structural code modifications occurred (e.g., plain documentation updates)
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dynamic Execution Matrix: Iterates concurrently only over the subset of modified microservices
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      # 1. Clone the codebase into the virtual runner workspace host
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Provision and configure the OpenJDK 17 build environment
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compile the targeted service source into an executable JAR binary (Skipping test suites for rapid delivery)
      - name: Build JAR Package with Maven
        run: mvn -B -pl ${{ matrix.service }} -am clean package -DskipTests

      # 4. Securely authenticate session credentials against Docker Hub repository using GitHub Encrypted Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Synthesize OCI container layers and dispatch to the remote registry with production tags (latest & unique Commit SHA)
      - name: Build and Push Docker Image
        run: |
          # Standardize image coordinate namespaces matching user workspace parameters
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}"

          # Build the immutable image artifact layers locally on the worker node
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -f ${{ matrix.service }}/Dockerfile \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

          # Push built multi-tagged container records into the central Docker Hub registry
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
