networks:
  cv-network:
    driver: bridge

services:
  # 1. Centralized Relational Storage Engine
  mysql:
    image: mysql:8.0
    container_name: cv-mysql
    init: true
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - cv-network
    volumes:
      - mysql-data:/var/lib/mysql

  # 2. Distributed Event Coordination Engine (Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: cv-zookeeper
    init: true
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cv-network

  # 3. Distributed Message Broker & Event Streaming (Apache Kafka)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: cv-kafka
    init: true
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    networks:
      - cv-network

  # 4. Service Registry & Discovery Server (Eureka)
  discovery-server:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
      args:
        SERVICE_NAME: discovery-server
    container_name: cv-discovery-server
    ports:
      - "8761:8761"
    networks:
      - cv-network

  # 5. Reverse Proxy & Request Router (API Gateway)
  api-gateway:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: cv-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    networks:
      - cv-network

  # 6. Identity & Access Management Service (Identity Service)
  identity-service:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./identity-service/Dockerfile
      args:
        SERVICE_NAME: identity-service
    container_name: cv-identity-service
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - cv-network

  # 7. Core CV Lifecycle & Management Service (CV Management Service)
  cv-management-service:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./cv-management-service/Dockerfile
      args:
        SERVICE_NAME: cv-management-service
    container_name: cv-management-service
    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cv_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - cv-network

  # 8. Public Discovery & Social Interaction Service (Discovery & Social Service)
  discovery-social-service:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./discovery-social-service/Dockerfile
      args:
        SERVICE_NAME: discovery-social-service
    container_name: cv-discovery-social-service
    ports:
      - "8083:8083"
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/interaction_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CV_GATEWAY_BASE_URL: http://api-gateway:8080
      GRPC_CLIENT_IDENTITY-SERVICE_ADDRESS: discovery:///identity-service
    networks:
      - cv-network

volumes:
  mysql-data:
